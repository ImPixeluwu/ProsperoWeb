<!-- ProsperoWeb home screen background (sce_sys/pic0.png and pic1.png).
     Original artwork: the icon's globe and orbit, large and faint, over a dark
     gradient and a dot grid, with the wordmark at the right. The left half and
     the bottom stay calm for the console's own UI. The wordmark is set in
     Noto Sans Bold (SIL OFL 1.1). Rendered by scripts/assets/render.sh at
     1920x1080 and 3840x2160. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="0.6" stop-color="#121418"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="1400" cy="470" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#3d8bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="globe-fill" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1b3f80" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#9aa2b1"/>
    </pattern>
    <!-- The dot grid fades in towards the upper right only. -->
    <radialGradient id="dots-fade" cx="1500" cy="420" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dots-mask"><rect width="1920" height="1080" fill="url(#dots-fade)"/></mask>
    <clipPath id="globe"><circle cx="1400" cy="470" r="250"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)" mask="url(#dots-mask)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Wide orbit rings, as on the icon (tilted -24 degrees). -->
  <g fill="none" transform="rotate(-24 1400 470)">
    <ellipse cx="1400" cy="470" rx="560" ry="180" stroke="#7cb3ff" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M 1020 470 A 380 128 0 0 1 1780 470" stroke="#9aa2b1" stroke-opacity="0.35" stroke-width="10"/>
  </g>

  <!-- Globe. -->
  <circle cx="1400" cy="470" r="250" fill="url(#globe-fill)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#0b0c0f" stroke-opacity="0.45" stroke-width="12">
    <ellipse cx="1400" cy="470" rx="105" ry="250"/>
    <line x1="1400" y1="200" x2="1400" y2="740"/>
    <path d="M 1140 376 Q 1400 434 1660 376"/>
    <path d="M 1140 564 Q 1400 506 1660 564"/>
  </g>

  <!-- Orbit front part with its moon. -->
  <g transform="rotate(-24 1400 470)" fill="none">
    <path d="M 1020 470 A 380 128 0 0 0 1780 470" clip-path="url(#globe)"
          stroke="#0b0c0f" stroke-opacity="0.5" stroke-width="40"/>
  </g>
  <path d="M 1020 470 A 380 128 0 0 0 1780 470" transform="rotate(-24 1400 470)"
        fill="none" stroke="#eef0f4" stroke-opacity="0.9" stroke-width="14" stroke-linecap="round"/>
  <circle cx="1744" cy="365" r="56" fill="#eef0f4"/>

  <!-- Wordmark. -->
  <text x="1840" y="900" text-anchor="end" font-family="Noto Sans" font-weight="700"
        font-size="96" letter-spacing="-1" fill="#eef0f4">Prospero<tspan fill="#7cb3ff">Web</tspan></text>
  <text x="1840" y="956" text-anchor="end" font-family="Noto Sans" font-weight="400"
        font-size="34" fill="#9aa2b1">A WebKit web browser for the living room</text>
</svg>

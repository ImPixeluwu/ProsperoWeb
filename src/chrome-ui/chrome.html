<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProsperoBrowser chrome</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<div id="band" class="band">
  <div id="tabstrip" class="tabstrip">
    <div id="tabs" class="tabs"></div>
    <button id="tab-new" class="tab-new" title="New tab (Touchpad)">+</button>
  </div>
  <div class="toolbar">
    <button id="nav-back" class="navbtn" title="Back (Circle)">&#x2190;</button>
    <button id="nav-fwd" class="navbtn" title="Forward">&#x2192;</button>
    <button id="nav-reload" class="navbtn" title="Reload (Create)">&#x21bb;</button>
    <form id="address-form" class="address" autocomplete="off">
      <span id="address-lock" class="address-lock"></span>
      <input id="address" type="text" spellcheck="false" autocapitalize="off"
             placeholder="Search or enter address">
      <span class="hint"><span class="glyph triangle">&#x25b3;</span></span>
    </form>
    <div id="spinner" class="spinner" hidden></div>
    <button id="menu-btn" class="navbtn menu-btn" title="Menu (Options)">&#x2261;</button>
  </div>
</div>

<div id="menu" class="menu" hidden>
  <div id="menu-title" class="menu-title"></div>
  <ol id="menu-items" class="menu-items"></ol>
  <div class="menu-hints">
    <span><span class="glyph cross">&#x2715;</span> Select</span>
    <span><span class="glyph circle">&#x25cb;</span> Back</span>
  </div>
</div>

<div id="notice-backdrop" class="notice-backdrop" hidden>
  <div id="notice" class="notice" role="alertdialog" aria-labelledby="notice-title">
    <div id="notice-icon" class="notice-icon"></div>
    <h1 id="notice-title"></h1>
    <p id="notice-text"></p>
    <div class="notice-buttons">
      <button id="notice-ok" class="btn primary"><span class="glyph cross">&#x2715;</span> OK</button>
      <button id="notice-cancel" class="btn"><span class="glyph circle">&#x25cb;</span> Cancel</button>
    </div>
  </div>
</div>

<div id="osk" class="osk" hidden>
  <div class="osk-head">
    <div id="osk-target" class="osk-target"></div>
    <div id="osk-text" class="osk-text"></div>
  </div>
  <div id="osk-keys" class="osk-keys"></div>
  <div class="osk-hints">
    <span><span class="glyph cross">&#x2715;</span> Key</span>
    <span>L1/R1 Caret</span>
    <span><span class="glyph square">&#x25a1;</span> Delete (hold to repeat)</span>
    <span><span class="glyph triangle">&#x25b3;</span> Space</span>
    <span>L2 Shift</span>
    <span>Touchpad Layout</span>
    <span>OPTIONS Done</span>
    <span><span class="glyph circle">&#x25cb;</span> Cancel</span>
  </div>
</div>

<div id="pointer" class="pointer" hidden></div>

<script src="chrome.js"></script>
</body>
</html>

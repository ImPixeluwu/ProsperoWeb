#
# Meson cross file for the PS5 payload SDK. Needs a [constants] entry
# "sdk" (path of the SDK) from a machine file passed before this one;
# build-deps.sh generates it. pkg-config is our wrapper next to this file.

[binaries]
c = sdk / 'bin/prospero-clang'
cpp = sdk / 'bin/prospero-clang++'
ar = sdk / 'bin/prospero-ar'
ranlib = sdk / 'bin/prospero-ranlib'
strip = sdk / 'bin/prospero-strip'
nm = sdk / 'bin/prospero-nm'
cmake = sdk / 'bin/prospero-cmake'
pkg-config = '@DIRNAME@' / 'pkg-config'

[host_machine]
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
default_library = 'static'
b_staticpic = true

[properties]
needs_exe_wrapper = true
cmake_toolchain_file = sdk / 'toolchain/prospero.cmake'

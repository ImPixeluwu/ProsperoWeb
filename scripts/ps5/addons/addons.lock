# kind: ads      merged into the ads+privacy filter set (always active when
#                the ad blocker is on): compiled into addons/adblock-ads.filters.json
#       cookie   the cookie-banner set (active only when the "Block cookie
#                banners" sub-toggle is on): addons/adblock-cookie.filters.json
#
# EasyList + EasyPrivacy (GPLv3 / CC BY-SA 3.0) and uBlock Origin's own default
# lists from uAssets (GPLv3) are merged for the best page-ad / YouTube coverage.
# These are LIVE, frequently-updated lists, so the sha256 pins a point-in-time
# SNAPSHOT (the bundled baseline). The on-device updater refetches the same
# URLs fresh and rebuilds with the same converter (core::adblock). Downloaded
# text is untrusted data: only parsed, never executed. Set ADDONS_ALLOW_
# UNPINNED=1 to take whatever upstream serves now after a drift.
#
# Snapshot pinned 2026-11-01.


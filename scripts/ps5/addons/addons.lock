# Ad-block filter lists bundled into dist/prosperoweb/addons by
# scripts/ps5/addons/stage-addons.sh.
#
#   kind  name              sha256  url
#
# kind: ads      part of the ads+privacy ruleset (always active when the ad
#                blocker is on): compiled into addons/adblock-ads.json
#       cookie   the cookie-banner ruleset (active only when the "Block cookie
#                banners" sub-toggle is on): compiled into addons/adblock-cookie.json
#
# These are LIVE, frequently-updated lists, so the sha256 pins a point-in-time
# SNAPSHOT: the bundled baseline shipped with the browser. The on-device
# updater (ps5_addons.cpp) ignores this sha and refetches the same URLs fresh,
# recompiling with the same converter (tools/addons_convert / core::adblock).
#
# Downloaded text is untrusted data: it is only parsed by the converter, never
# executed. To refresh the snapshot after upstream changes, re-download and
# replace the sha256 here (stage-addons.sh verifies it on every build).
#
# Snapshot pinned 2026-11-01 (EasyList version 202611011700).

